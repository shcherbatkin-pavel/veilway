---
- name: Require explicit heartbeat installation approval
  ansible.builtin.assert:
    that:
      - veilway_heartbeat_apply_ack | bool
      - veilway_mode in ['aws-direct', 'yc-direct']
      - veilway_heartbeat_endpoint == 'https://veilway.ru/api/v1/agents/' ~ veilway_mode ~ '/heartbeat'
      - veilway_heartbeat_token | length >= 32
      - veilway_heartbeat_containers | length >= 1
      - veilway_heartbeat_containers | length <= 8
      - veilway_heartbeat_containers | unique | length == veilway_heartbeat_containers | length
    quiet: true
  no_log: true

- name: Create the heartbeat configuration directory
  ansible.builtin.file:
    path: "{{ veilway_heartbeat_config_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the outbound-only heartbeat agent
  ansible.builtin.copy:
    src: veilway-heartbeat-agent
    dest: /usr/local/sbin/veilway-heartbeat-agent
    owner: root
    group: root
    mode: "0755"

- name: Install the heartbeat configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ veilway_heartbeat_config_root }}/config.json"
    owner: root
    group: root
    mode: "0600"

- name: Install the heartbeat token
  ansible.builtin.copy:
    content: "{{ veilway_heartbeat_token }}\n"
    dest: "{{ veilway_heartbeat_config_root }}/token"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Install the heartbeat systemd service
  ansible.builtin.template:
    src: veilway-heartbeat.service.j2
    dest: /etc/systemd/system/veilway-heartbeat.service
    owner: root
    group: root
    mode: "0644"

- name: Install the heartbeat systemd timer
  ansible.builtin.template:
    src: veilway-heartbeat.timer.j2
    dest: /etc/systemd/system/veilway-heartbeat.timer
    owner: root
    group: root
    mode: "0644"

- name: Enable and start only the heartbeat timer
  ansible.builtin.systemd_service:
    name: veilway-heartbeat.timer
    enabled: true
    state: started
    daemon_reload: true
