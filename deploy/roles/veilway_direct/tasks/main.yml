---
- name: Check CA and CRL authority before deployment
  ansible.builtin.import_tasks: authority.yml

- name: Run the read-only deployment preflight
  ansible.builtin.import_tasks: preflight.yml

- name: Finish the role after preflight in Ansible check mode
  ansible.builtin.meta: end_role
  when: ansible_check_mode

- name: Run host phase
  ansible.builtin.import_tasks: host.yml

- name: Run network phase
  ansible.builtin.import_tasks: network.yml

- name: Run pki phase
  ansible.builtin.import_tasks: pki.yml

- name: Run configuration phase
  ansible.builtin.import_tasks: configuration.yml

- name: Run services phase
  ansible.builtin.import_tasks: services.yml

- name: Run cleanup phase
  ansible.builtin.import_tasks: cleanup.yml

- name: Run health phase
  ansible.builtin.import_tasks: health.yml
