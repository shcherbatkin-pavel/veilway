---
- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted

- name: Apply Veilway sysctl
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - --system
  changed_when: true

- name: Validate Veilway firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/nft
      - --check
      - --file
      - /etc/nftables.conf
  changed_when: false
  listen: Reload Veilway firewall

- name: Apply Veilway firewall
  ansible.builtin.command:
    argv:
      - /usr/sbin/nft
      - --file
      - /etc/nftables.conf
  changed_when: true
  listen: Reload Veilway firewall
