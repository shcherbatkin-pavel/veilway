---
- name: Start PostgreSQL before migrations
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --file
      - "{{ veilway_control_install_root }}/app/compose.yaml"
      - up
      - --detach
      - db
  register: veilway_control_db_start
  changed_when: "'Started' in veilway_control_db_start.stdout or 'Created' in veilway_control_db_start.stdout"

- name: Apply database migrations
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --file
      - "{{ veilway_control_install_root }}/app/compose.yaml"
      - run
      - --rm
      - api
      - alembic
      - upgrade
      - head
  register: veilway_control_migrate
  changed_when: "'Running upgrade' in veilway_control_migrate.stdout"

- name: Synchronize the two immutable VPN VM records from protected stdin
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --file
      - "{{ veilway_control_install_root }}/app/compose.yaml"
      - run
      - --rm
      - --no-deps
      - api
      - veilway-control
      - sync-vms
    stdin: >-
      {{ {
        'aws-direct': {
          'instance_id': veilway_control_aws_direct_instance_id,
          'region': veilway_control_aws_region,
          'heartbeat_token': veilway_control_aws_heartbeat_token
        },
        'yc-direct': {
          'instance_id': veilway_control_yc_direct_instance_id,
          'region': veilway_control_yc_region,
          'heartbeat_token': veilway_control_yc_heartbeat_token
        }
      } | to_json }}
  no_log: true
  changed_when: true

- name: Synchronize separate CRL agent credential hashes from protected stdin
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --file
      - "{{ veilway_control_install_root }}/app/compose.yaml"
      - run
      - --rm
      - --no-deps
      - api
      - veilway-control
      - sync-crl-agents
    stdin: "{{ {'aws-direct': veilway_control_aws_crl_token, 'yc-direct': veilway_control_yc_crl_token} | to_json }}"
  no_log: true
  changed_when: true
