---
- name: Start the four control plane containers
  ansible.builtin.command:
    argv:
      - /usr/bin/docker
      - compose
      - --file
      - "{{ veilway_control_install_root }}/app/compose.yaml"
      - up
      - --detach
      - --remove-orphans
      - --force-recreate
      - api
      - web
      - pki
  register: veilway_control_start
  changed_when: "'Started' in veilway_control_start.stdout or 'Created' in veilway_control_start.stdout"
