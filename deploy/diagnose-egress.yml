---
- name: Diagnose Direct node egress without changing it
  hosts: direct_vpn
  become: true
  gather_facts: true
  serial: 1

  tasks:
    - name: Check the node IPv4 internet route
      ansible.builtin.command:
        argv:
          - /usr/sbin/ip
          - -4
          - -json
          - route
          - get
          - 1.1.1.1
      register: veilway_node_ipv4_route
      changed_when: false
      no_log: true

    - name: Require IPv4 internet routing through the cloud interface
      ansible.builtin.assert:
        that:
          - veilway_node_ipv4_route.stdout | from_json | length == 1
          - (veilway_node_ipv4_route.stdout | from_json)[0].dev == ansible_facts['default_ipv4']['interface']
        quiet: true

    - name: Query the approved Cloudflare trace endpoint over IPv4
      ansible.builtin.command:
        argv:
          - /usr/bin/curl
          - --ipv4
          - --fail
          - --silent
          - --show-error
          - --connect-timeout
          - "10"
          - --max-time
          - "20"
          - --noproxy
          - "*"
          - --proto
          - =https
          - --tlsv1.2
          - --
          - https://www.cloudflare.com/cdn-cgi/trace
      register: veilway_node_ipv4_trace
      changed_when: false
      no_log: true

    - name: Require the node IPv4 egress to match its protected endpoint
      ansible.builtin.assert:
        that:
          - >-
            (veilway_node_ipv4_trace.stdout_lines |
            select('match', '^ip=') | list | length) == 1
          - >-
            (veilway_node_ipv4_trace.stdout_lines |
            select('match', '^ip=') | first | regex_replace('^ip=', '')) ==
            ansible_host
        quiet: true
      no_log: true

    - name: Report the non-sensitive node egress result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} node IPv4 route and egress: passed"

    - name: Check the node IPv6 internet route
      ansible.builtin.command:
        argv:
          - /usr/sbin/ip
          - -6
          - -json
          - route
          - get
          - 2606:4700:4700::1111
      register: veilway_node_ipv6_route
      changed_when: false
      no_log: true
      when: veilway_enable_ipv6

    - name: Require IPv6 internet routing through the cloud interface
      ansible.builtin.assert:
        that:
          - veilway_node_ipv6_route.stdout | from_json | length == 1
          - >-
            (veilway_node_ipv6_route.stdout | from_json)[0].dev ==
            ansible_facts['default_ipv4']['interface']
        quiet: true
      no_log: true
      when: veilway_enable_ipv6

    - name: Read global IPv6 address metadata from the cloud interface
      ansible.builtin.command:
        argv:
          - /usr/sbin/ip
          - -6
          - -json
          - address
          - show
          - dev
          - "{{ ansible_facts['default_ipv4']['interface'] }}"
          - scope
          - global
      register: veilway_node_ipv6_addresses
      changed_when: false
      no_log: true
      when: veilway_enable_ipv6

    - name: Read cloud-interface IPv6 kernel settings
      ansible.builtin.command:
        argv:
          - /usr/sbin/sysctl
          - --values
          - "{{ item }}"
      loop:
        - "net.ipv6.conf.{{ ansible_facts['default_ipv4']['interface'] }}.disable_ipv6"
        - "net.ipv6.conf.{{ ansible_facts['default_ipv4']['interface'] }}.accept_ra"
        - "net.ipv6.conf.{{ ansible_facts['default_ipv4']['interface'] }}.autoconf"
      register: veilway_node_ipv6_interface_sysctls
      changed_when: false
      no_log: true
      when: veilway_enable_ipv6

    - name: Read the effective Netplan configuration without displaying it
      ansible.builtin.command:
        argv:
          - /usr/sbin/netplan
          - get
      register: veilway_node_netplan
      changed_when: false
      failed_when: false
      no_log: true
      when: veilway_enable_ipv6

    - name: Initialize matching cloud-interface Netplan definitions
      ansible.builtin.set_fact:
        veilway_node_netplan_cloud_definitions: []
      no_log: true
      when: veilway_enable_ipv6

    - name: Select matching cloud-interface Netplan definitions
      ansible.builtin.set_fact:
        veilway_node_netplan_cloud_definitions: >-
          {{ veilway_node_netplan_cloud_definitions + [item.value] }}
      loop: >-
        {{ ((veilway_node_netplan.stdout | from_yaml)
        .get('network', {}).get('ethernets', {})) | dict2items }}
      no_log: true
      when:
        - veilway_enable_ipv6
        - >-
          item.key == ansible_facts['default_ipv4']['interface'] or
          item.value.get('set-name', '') ==
          ansible_facts['default_ipv4']['interface']

    - name: Resolve the approved endpoint over IPv6 without displaying it
      ansible.builtin.command:
        argv:
          - /usr/bin/getent
          - ahostsv6
          - www.cloudflare.com
      register: veilway_node_ipv6_resolution
      changed_when: false
      failed_when: false
      no_log: true
      when: veilway_enable_ipv6

    - name: Query the approved Cloudflare trace endpoint over IPv6
      ansible.builtin.command:
        argv:
          - /usr/bin/curl
          - --ipv6
          - --fail
          - --silent
          - --show-error
          - --connect-timeout
          - "10"
          - --max-time
          - "20"
          - --noproxy
          - "*"
          - --proto
          - =https
          - --tlsv1.2
          - --
          - https://www.cloudflare.com/cdn-cgi/trace
      register: veilway_node_ipv6_trace
      changed_when: false
      failed_when: false
      no_log: true
      when: veilway_enable_ipv6

    - name: Build non-sensitive node IPv6 egress checks
      ansible.builtin.set_fact:
        veilway_node_ipv6_egress_checks:
          - name: cloud interface has a global IPv6 address
            passed: >-
              {{ veilway_node_ipv6_addresses.stdout | from_json | length == 1
              and ((veilway_node_ipv6_addresses.stdout | from_json)[0].addr_info |
              selectattr('local', 'defined') |
              selectattr('local', 'equalto', veilway_public_ipv6) |
              list | length) == 1 }}
          - name: IPv6 route selected a source address
            passed: >-
              {{ (veilway_node_ipv6_route.stdout |
              from_json)[0].get('prefsrc',
              (veilway_node_ipv6_route.stdout |
              from_json)[0].get('src', '')) == veilway_public_ipv6 }}
          - name: IPv6 is enabled on the cloud interface
            passed: >-
              {{ veilway_node_ipv6_interface_sysctls.results[0].stdout |
              trim == '0' }}
          - name: kernel router-advertisement handling is disabled
            passed: >-
              {{ veilway_node_ipv6_interface_sysctls.results[1].stdout |
              trim == '0' }}
          - name: kernel IPv6 address autoconfiguration is disabled
            passed: >-
              {{ veilway_node_ipv6_interface_sysctls.results[2].stdout |
              trim == '0' }}
          - name: Netplan selects exactly one cloud interface
            passed: >-
              {{ veilway_node_netplan_cloud_definitions | length == 1 }}
          - name: Netplan configures the assigned AWS ENI IPv6
            passed: >-
              {{ veilway_public_ipv6 ~ '/128' in
              (veilway_node_netplan_cloud_definitions |
              first | default({})).get('addresses', []) }}
          - name: Netplan enables router advertisements
            passed: >-
              {{ (veilway_node_netplan_cloud_definitions |
              first | default({})).get('accept-ra', false) | bool }}
          - name: approved endpoint has a usable AAAA resolution
            passed: >-
              {{ veilway_node_ipv6_resolution.rc == 0 and
              veilway_node_ipv6_resolution.stdout | trim | length > 0 }}
          - name: AWS node IPv6 HTTPS egress
            passed: >-
              {{ veilway_node_ipv6_trace.rc == 0 and
              (veilway_node_ipv6_trace.stdout_lines |
              select('match', '^ip=') | list | length) == 1 and
              ':' in (veilway_node_ipv6_trace.stdout_lines |
              select('match', '^ip=') | first | regex_replace('^ip=', '')) }}
      no_log: true
      when: veilway_enable_ipv6

    - name: Require the non-sensitive node IPv6 egress contract
      ansible.builtin.assert:
        that:
          - item.passed | bool
        quiet: true
      loop: "{{ veilway_node_ipv6_egress_checks }}"
      loop_control:
        label: "{{ item.name }}"
      when: veilway_enable_ipv6

    - name: Report the non-sensitive node IPv6 egress result
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} node IPv6 route and egress: passed"
      when: veilway_enable_ipv6
